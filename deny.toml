# cargo-deny (CI: `cargo deny check advisories` desde src-tauri/).
# Antes vivía en la raíz del monorepo y se aplicaba a este crate al compilarlo allí;
# desde la división en submódulos el repo necesita el suyo.

[advisories]
# Solo avisos "unmaintained" de dependencias directas: los de la pila GTK/zbus llegan
# por Tauri en Linux y no tienen alternativa mantenida.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
