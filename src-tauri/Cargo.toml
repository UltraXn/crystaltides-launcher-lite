[package]
name = "launcher-lite-tauri"
version = "0.1.2"
description = "CrystalTides Lite Launcher (Tauri v2)"
authors = ["CrystalTides Engineering"]
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "launcher_lite_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Sin la feature "zip": arrastra zip 4.x (RUSTSEC-2026-0367/0368/0369, sin parche en 4.x)
# y el updater descarga un .exe firmado, no un .zip ni un .tar.gz.
tauri-plugin-updater = { version = "~2.13.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
zip = "9.0.3"
walkdir = "2.3"
dirs = "6.0"
sysinfo = "0.39"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
fastnbt = "2.6.3"
flate2 = "1.1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
qbsdiff = "1.4.4"
uuid = { version = "1", features = ["v4"] }
tar = "0.4"
keyring = "4"
thiserror = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"


