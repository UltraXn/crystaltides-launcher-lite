[package]
name = "launcher-lite-tauri"
version = "0.1.0"
description = "CrystalTides Lite Launcher (Tauri v2)"
authors = ["CrystalTides Engineering"]
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "launcher_lite_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "~2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls", "stream"] }
zip = "8.1.0"
walkdir = "2.3"
dirs = "6.0"
sysinfo = "0.30"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Registry"] }

[lints]
workspace = true
