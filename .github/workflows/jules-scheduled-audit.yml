name: Jules Automated Swarm (Bugs, Dead Code & Security)

on:
  schedule:
    # Ejecución periódica desatendida: Todos los lunes a las 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      approval_required:
        description: 'Requerir aprobación de plan antes de que Jules aplique cambios'
        required: true
        default: 'true'
        type: boolean

concurrency:
  group: jules-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch-jules-swarm:
    name: Dispatch 10 Jules Agents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dispatch Jules Agents
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.approval_required }}" = "false" ]; then
            node scripts/jules_orchestrator.mjs --dispatch --no-approval
          else
            node scripts/jules_orchestrator.mjs --dispatch
          fi
