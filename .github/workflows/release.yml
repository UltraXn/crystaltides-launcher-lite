name: Release Standalone Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión (ej: v0.1.1)'
        required: false
        default: ''

concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Standalone Windows Launcher
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install dependencies
        run: npm install

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Build Standalone Launcher (Tauri CLI)
        run: npx tauri build --no-bundle --ignore-version-mismatches
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare Release Artifacts & Sign Updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          
          # 1. Localizar binario generado
          $exeSource = Get-ChildItem -Path "src-tauri/target/release", "target/release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*launcher*" -and $_.Name -notlike "*.build*" -and $_.Name -notlike "*deps*" } |
            Select-Object -First 1

          if (-not $exeSource) {
            Write-Error "No se encontró el ejecutable en target/release!"
            exit 1
          }

          Write-Host "✓ Binario localizado: $($exeSource.FullName) ($($exeSource.Length) bytes)"
          Copy-Item -Path $exeSource.FullName -Destination "release-artifacts/CrystalTidesLauncher.exe" -Force
          Copy-Item -Path $exeSource.FullName -Destination "release-artifacts/CrystalTides-Setup.exe" -Force

          # 2. Generar archivo .zip para el AutoUpdater
          $zipPath = "release-artifacts/CrystalTidesLauncher-windows-x86_64.zip"
          Write-Host "📦 Creando paquete de actualización: $zipPath"
          Compress-Archive -Path $exeSource.FullName -DestinationPath $zipPath -Force

          # 3. Firmar paquete de actualización y generar latest.json
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "🔐 Firmando archivo para AutoUpdater con Tauri Signer..."
            npx tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p "$($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)" $zipPath

            $sigFile = "$zipPath.sig"
            if (Test-Path $sigFile) {
              $sigContent = (Get-Content -Path $sigFile -Raw).Trim()
              $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "v0.1.0" }
              $cleanVersion = $tag -replace '^v', ''
              $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

              $latestManifest = @{
                version = $cleanVersion
                notes = "Actualización de CrystalTides Launcher ($tag)"
                pub_date = $pubDate
                platforms = @{
                  "windows-x86_64" = @{
                    signature = $sigContent
                    url = "https://github.com/UltraXn/crystaltides-launcher-lite/releases/download/$tag/CrystalTidesLauncher-windows-x86_64.zip"
                  }
                }
              }

              $manifestJson = $latestManifest | ConvertTo-Json -Depth 5
              $manifestJson | Set-Content -Path "release-artifacts/latest.json" -Encoding utf8
              Write-Host "✓ latest.json generado con éxito:"
              Write-Host $manifestJson
            } else {
              Write-Warning "No se pudo encontrar el archivo de firma $sigFile"
            }
          } else {
            Write-Warning "⚠️ TAURI_SIGNING_PRIVATE_KEY no está configurado en los Secrets. Se omitió la firma y latest.json."
          }

          # 4. Generar Checksums SHA256
          Get-ChildItem -Path release-artifacts -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath release-artifacts/SHA256SUMS.txt -Append -Encoding utf8
          }

          Get-ChildItem -Path release-artifacts | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
          name: "CrystalTides Launcher ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
