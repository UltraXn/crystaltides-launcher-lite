name: Release Standalone Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión (ej: v0.1.1)'
        required: false
        default: ''

concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Standalone Windows Launcher
    runs-on: windows-latest
    # Release con LTO fat + codegen-units=1: ~9 min en local desde cero, más en runners de CI
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Supabase Environment Variables
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:VITE_SUPABASE_URL -or -not $env:VITE_SUPABASE_ANON_KEY) {
            Write-Error "CRITICAL: VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY son requeridas en secrets o vars de GitHub Actions para el build de producción."
            exit 1
          }
          Write-Host "✓ Supabase environment variables verified."

      - name: Verify release tag matches app version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
        run: |
          # El updater compara la versión compilada (tauri.conf.json) con latest.json (tag).
          # Si difieren, la app instalada vería siempre una actualización (o nunca ninguna).
          $tag = $env:RELEASE_TAG
          if (-not $tag -or $tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Tag de release inválido o ausente: '$tag' (se espera vX.Y.Z)"
            exit 1
          }
          $tagVersion = $tag -replace '^v', ''
          $confVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tagVersion -ne $confVersion -or $tagVersion -ne $cargoVersion) {
            Write-Error "Versión desalineada: tag=$tagVersion tauri.conf.json=$confVersion Cargo.toml=$cargoVersion"
            exit 1
          }
          Write-Host "✓ Versión $tagVersion alineada (tag, tauri.conf.json, Cargo.toml)"

      - name: Build Self-Installing Launcher (Tauri CLI, no bundle)
        # bundle.active=false: el propio ejecutable es el instalador (BootMode::Install).
        # El frontend (tsc + vite) lo compila beforeBuildCommand con estas mismas variables.
        # Perfil release (LTO, strip, panic=abort) en .cargo/config.toml.
        run: pnpm tauri build --no-bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Prepare Release Artifacts & Sign Updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          
          # 1. Localizar el binario release. El mismo ejecutable es instalador y launcher:
          #    - CrystalTides-Setup.exe   ("setup" en el nombre -> asistente propio de instalación)
          #    - CrystalTides-Portable.exe ("portable" en el nombre -> sin instalar)
          $exeSource = @("src-tauri/target/release/launcher-lite-tauri.exe", "target/release/launcher-lite-tauri.exe") |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exeSource) {
            Write-Error "No se encontró launcher-lite-tauri.exe en target/release!"
            exit 1
          }

          Write-Host "✓ Binario localizado: $exeSource ($((Get-Item $exeSource).Length) bytes)"
          Copy-Item -Path $exeSource -Destination "release-artifacts/CrystalTides-Setup.exe" -Force
          Copy-Item -Path $exeSource -Destination "release-artifacts/CrystalTides-Portable.exe" -Force

          # 2. Firmar el instalador para el AutoUpdater y generar latest.json.
          #    tauri-plugin-updater lo ejecuta con /P /UPDATE; self_update.rs reemplaza bin/ y relanza.
          $updaterTarget = "release-artifacts/CrystalTides-Setup.exe"
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "🔐 Firmando instalador para AutoUpdater con Tauri Signer..."
            pnpm tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p "$($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)" $updaterTarget

            $sigFile = "$updaterTarget.sig"
            if (Test-Path $sigFile) {
              $sigContent = (Get-Content -Path $sigFile -Raw).Trim()
              $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "v0.1.0" }
              $cleanVersion = $tag -replace '^v', ''
              $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

              $latestManifest = @{
                version = $cleanVersion
                notes = "Actualización de CrystalTides Launcher ($tag)"
                pub_date = $pubDate
                platforms = @{
                  "windows-x86_64" = @{
                    signature = $sigContent
                    url = "https://github.com/UltraXn/crystaltides-launcher-lite/releases/download/$tag/CrystalTides-Setup.exe"
                  }
                }
              }

              $manifestJson = $latestManifest | ConvertTo-Json -Depth 5
              $manifestJson | Set-Content -Path "release-artifacts/latest.json" -Encoding utf8
              Write-Host "✓ latest.json generado con éxito:"
              Write-Host $manifestJson
            } else {
              Write-Warning "No se pudo encontrar el archivo de firma $sigFile"
            }
          } else {
            Write-Warning "⚠️ TAURI_SIGNING_PRIVATE_KEY no está configurado en los Secrets. Se omitió la firma y latest.json."
          }

          # 4. Generar Checksums SHA256
          Get-ChildItem -Path release-artifacts -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath release-artifacts/SHA256SUMS.txt -Append -Encoding utf8
          }

          Get-ChildItem -Path release-artifacts | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
          name: "CrystalTides Launcher ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
