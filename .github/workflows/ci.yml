name: CI (Quality, Vitest & Rust Safety)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Quality & Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm run lint

      - name: Typecheck Test Files
        run: pnpm run typecheck:tests

      - name: Oxlint Static Analysis
        run: pnpm run lint:fast

      - name: Run Vitest Suite
        run: pnpm run test

      - name: Build Frontend Bundle
        run: pnpm run build

      - name: React Doctor Quality Gate (Score >= 68)
        run: pnpm run doctor:ci

  # Windows es la plataforma real del launcher; Linux compila los stubs y corre en CI.
  # fmt, clippy -D warnings, cargo-deny y ct-agent venian del CI del monorepo, que ya no
  # compila este submodulo.
  rust-check:
    name: Rust Backend Safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux Dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libssl-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf             xdg-utils

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Check Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      # --locked: falla si Cargo.lock no coincide con Cargo.toml en vez de re-resolver en silencio
      - name: Clippy
        run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deny

      - name: Security & Dependency Audit
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo deny check advisories

      # Puts the MSVC tools (dumpbin) on PATH for the architecture check below.
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify ct-agent.dll compilation (MSVC x64)
        if: runner.os == 'Windows'
        working-directory: native/ct-agent
        shell: pwsh
        run: |
          $jdk = if ($env:JAVA_HOME_21_X64) { $env:JAVA_HOME_21_X64 } else { $env:JAVA_HOME }
          .\build.ps1 -JdkPath $jdk
          $headers = dumpbin /headers ct-agent.dll
          if (($headers -join "`n") -notmatch "machine \(x64\)") {
            Write-Error "ct-agent.dll is not x64 architecture!"
            exit 1
          }
